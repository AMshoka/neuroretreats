<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neuro Retreats — Under construction</title>
  <meta name="description" content="The Neuro Retreats website is under construction. We’re building something new. Please check back soon.">
  <link rel="canonical" href="https://neuroretreats.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neuro Retreats">
  <meta property="og:title" content="Neuro Retreats — Under construction">
  <meta property="og:description" content="The Neuro Retreats website is under construction. Please check back soon.">
  <meta property="og:url" content="https://neuroretreats.com/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2320433c'/%3E%3Cg%20fill='none'%20stroke='%23f4efe6'%20stroke-width='3.5'%3E%3Ccircle%20cx='32'%20cy='32'%20r='12.5'%20opacity='.9'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='22'%20opacity='.45'/%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='4.6'%20fill='%23eaa67a'/%3E%3C/svg%3E">

  <style>
    /* ---------- Palette ---------- */
    :root {
      color-scheme: light dark;

      --paper: #f4efe6;        /* warm paper */
      --paper-glow: #faf7f1;   /* soft highlight behind the content */
      --ink: #1d2825;          /* headline, wordmark */
      --ink-soft: #4b5651;     /* supporting text, footer */
      --accent: #2a5a52;       /* deep teal: links */
      --art: #2f6157;          /* line art */
      --warm: #b8623c;         /* the one warm note: the drop */
      --dawn: #e09a68;         /* faint glow behind the ripples... */
      --dawn-strength: .17;    /* ...and how strong it is */
      --rule: rgba(29, 40, 37, .26);
      --grain: .16;

      /* Fluid units. --vh is 1% of the height that is visible while the
         browser's bars are showing (see @supports below). --w is 1% of the
         width, held back on screens that are short for their width: 2.8% of
         the height less 6.6px is the largest scale at which the tallest
         stack (the one with a follow-up line) still fits with room to spare. */
      --vh: 1vh;
      --w: min(1vw, 2.8 * var(--vh) - 6.6px);

      --line: clamp(1px, .9px + .02 * var(--w), 1.5px);    /* line-art stroke width */
      --tip: clamp(3px, 2.5px + .085 * var(--w), 4.5px);   /* dots at the filament tips */
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
        "URW Palladio L", P052, Georgia, "Times New Roman", serif;

      /* The frame's distance from the screen edges. The sides never sit
         further in than the top and bottom. */
      --inset-y: clamp(1.5rem, 2.5 * var(--w), 3.5rem);
      --inset-x: clamp(min(.875rem, 4.4vw), 2.5vw, var(--inset-y));

      /* The same, clear of a notch or home indicator. The labels straddle
         the top and bottom rules, hence the extra 1rem there. */
      --pad-top: max(var(--inset-y), env(safe-area-inset-top, 0px) + 1rem);
      --pad-right: max(var(--inset-x), env(safe-area-inset-right, 0px));
      --pad-bottom: max(var(--inset-y), env(safe-area-inset-bottom, 0px) + 1rem);
      --pad-left: max(var(--inset-x), env(safe-area-inset-left, 0px));

      /* Width of the content column: the screen less the frame and the
         gutters inside it. */
      --gutter: min(5vw, 3rem);
      --column: calc(100vw - var(--pad-left) - var(--pad-right) - 2px - 2 * var(--gutter));
    }

    @supports (height: 1svh) {
      :root {
        --vh: 1svh;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111816;
        --paper-glow: #18221f;
        --ink: #ece6da;
        --ink-soft: #a9b3ab;
        --accent: #a3c4b7;
        --art: #8fb3a5;
        --warm: #e0a17a;
        --dawn: #cc8052;
        --dawn-strength: .12;
        --rule: rgba(236, 230, 218, .2);
        --grain: .07;
      }
    }

    /* ---------- Base ---------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Everything is sized in rem, so very large screens scale the whole page. */
    html {
      background: var(--paper);
      font-size: clamp(100%, .5rem + .42 * var(--w), 175%);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: relative;
      z-index: 0;
      display: grid;
      grid-template: auto 1fr auto / minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
      background: radial-gradient(120% 75% at 50% 40%, var(--paper-glow), var(--paper) 72%);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* A whisper of paper grain; it also keeps the soft gradient from banding. */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: var(--grain);
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.85'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%20.52%200%200%200%200%20.5%200%200%200%200%20.46%200%200%200%201.6%20-.6'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
    }

    ::selection {
      background: var(--accent);
      color: var(--paper);
    }

    /* ---------- Frame ----------
       A hairline frame around the page, drawn by the three landmarks
       themselves: the header and footer each draw one horizontal edge and its
       two corners, interrupted by their label; main draws the two sides. */
    .edge {
      --gap: clamp(.625rem, 2.5vw, 1.5rem);   /* between a label and its rules */
      display: flex;
      align-items: center;
      min-width: 0;
      height: calc(2rem + 1px);
    }

    .edge::before,
    .edge::after {
      content: "";
      flex: 1 0 .5rem;
      height: calc(1rem + 1px);
      border: 0 solid var(--rule);
    }

    .edge--top {
      margin-top: -1rem;
    }

    .edge--top::before,
    .edge--top::after {
      align-self: flex-end;
      border-top-width: 1px;
    }

    .edge--bottom {
      margin-bottom: -1rem;
    }

    .edge--bottom::before,
    .edge--bottom::after {
      align-self: flex-start;
      border-bottom-width: 1px;
    }

    .edge::before {
      border-left-width: 1px;
    }

    .edge::after {
      border-right-width: 1px;
    }

    /* Both labels shrink with the viewport (the vw term) before they would
       ever need to wrap, so the page has no fixed minimum width. */
    .wordmark,
    .legal {
      position: relative;
      min-width: 0;
      line-height: 1.25;
      text-align: center;
    }

    .wordmark {
      top: .05em;               /* optically centre the capitals on the rule */
      margin: 0 calc(var(--gap) - .3em) 0 var(--gap);   /* less the trailing letter-space */
      font-size: min(clamp(.9375rem, .8rem + .6 * var(--w), 1.875rem), 4.6vw);
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .legal {
      top: .06em;
      margin: 0 calc(var(--gap) - .06em) 0 var(--gap);
      color: var(--ink-soft);
      font-size: min(clamp(.875rem, .8rem + .22 * var(--w), 1.125rem), 5.6vw);
      letter-spacing: .06em;
      white-space: nowrap;
    }

    /* ---------- Content ---------- */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.75rem, 7 * var(--vh), 4.5rem) var(--gutter) clamp(2.25rem, 11 * var(--vh), 7.5rem);
      border: solid var(--rule);
      border-width: 0 1px;
      text-align: center;
    }

    /* The artwork is the one flexible part of the stack. It is --mark wide
       when there is room, and gives way (the drawing scales down inside its
       box) rather than push the page past the bottom of the screen. */
    .mark {
      --mark: clamp(15rem, 12rem + 26 * var(--w), 52rem);
      display: block;
      flex: 1 1 0px;
      width: min(100%, var(--mark));
      min-height: 2.5rem;
      max-height: calc(min(var(--column), var(--mark)) * 224 / 520);
      margin-bottom: clamp(1.5rem, 4.5 * var(--vh), 3.5rem);
      overflow: visible;        /* lets the glow spill softly past the artwork */
      color: var(--art);
    }

    .mark .ring,
    .mark .arbor path,
    .mark .tips {
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .mark .ring {
      stroke: currentColor;
      stroke-width: var(--line);
    }

    /* The filaments thin out and fade a little with each branching. */
    .mark .arbor path {
      stroke: currentColor;
      stroke-width: var(--line);
      stroke-opacity: .85;
    }

    .mark .arbor path:nth-child(2) {
      stroke-width: calc(var(--line) * .88);
      stroke-opacity: .75;
    }

    .mark .arbor path:nth-child(3) {
      stroke-width: calc(var(--line) * .76);
      stroke-opacity: .66;
    }

    .mark .tips {
      stroke: currentColor;
      stroke-width: var(--tip);
      stroke-opacity: .85;
    }

    .mark .drop {
      fill: var(--warm);
    }

    .mark .glow stop {
      stop-color: var(--dawn);
      stop-opacity: var(--dawn-strength);
    }

    .mark .glow stop:nth-child(2) {
      stop-opacity: calc(var(--dawn-strength) * .4);
    }

    .mark .glow stop:last-child {
      stop-opacity: 0;
    }

    h1 {
      max-width: 100%;
      margin: 0;
      font-size: min(clamp(2rem, 1.25rem + 3.6 * var(--w), 5.5rem), 13.5vw);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -.012em;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .lede {
      max-width: 100%;
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(1rem, .9rem + .5 * var(--w), 1.75rem);
    }

    .lede span {
      display: inline-block;    /* each sentence wraps as a unit */
      max-width: 100%;
      text-wrap: balance;
    }

    .lede::before {
      content: "";
      display: block;
      width: clamp(1.75rem, 1.5rem + .8 * var(--w), 3rem);
      height: 1px;
      margin: clamp(1.25rem, 3.6 * var(--vh), 2.25rem) auto clamp(1.125rem, 3.2 * var(--vh), 2rem);
      background: var(--art);
      opacity: .6;
    }

    /* One follow-up line under the text: the contact address on the home
       page (the CONTACT-SLOT in index.html) or the way back on the 404 page. */
    .contact,
    .back {
      max-width: 100%;
      margin: clamp(1.125rem, 3.2 * var(--vh), 1.875rem) 0 0;
      font-size: min(clamp(1rem, .92rem + .32 * var(--w), 1.375rem), 6.4vw);
      letter-spacing: .01em;
      overflow-wrap: anywhere;
    }

    .contact a,
    .back a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: .32em;
      transition: color .2s ease;
    }

    .contact a:hover,
    .back a:hover {
      color: var(--ink);
    }

    .contact a:focus-visible,
    .back a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: .3em;
      border-radius: 2px;
    }

    /* With that extra line the stack is taller: trim the space around it so
       it stays optically centred. (:where keeps this easy to override below.) */
    :where(:root:has(.contact, .back)) main {
      padding-bottom: clamp(2rem, 8 * var(--vh), 5.5rem);
    }

    :where(:root:has(.contact, .back)) .mark {
      margin-bottom: clamp(1.375rem, 3.8 * var(--vh), 3rem);
    }

    /* ---------- Adaptations ---------- */
    /* Upright and square screens (phones, tablets, foldables): there is
       height to spare, so the artwork and type grow faster. --u is 1% of the
       width, or of four fifths of the height when that is smaller. */
    @media (max-aspect-ratio: 1/1) {
      :root {
        --u: min(1vw, .8 * var(--vh));
      }

      .mark {
        --mark: min(10rem + 52 * var(--u), 52rem);
      }

      h1 {
        font-size: min(clamp(2rem, 1rem + 6 * var(--u), 5.5rem), 13.5vw);
      }

      .lede {
        font-size: clamp(1rem, .85rem + var(--u), 1.75rem);
      }

      .contact,
      .back {
        font-size: min(clamp(1rem, .82rem + .8 * var(--u), 1.375rem), 6.4vw);
      }
    }

    /* Small screens: slightly heavier line art so it holds up on paper white. */
    @media (max-width: 40rem) {
      :root {
        --line: 1.35px;
      }
    }

    /* Shorter screens showing the follow-up line: give the stack more room. */
    @media (max-height: 40rem) {
      :where(:root:has(.contact, .back)) main {
        padding-top: 1.5rem;
        padding-bottom: 2rem;
      }
    }

    /* Short screens: tighten the stack... */
    @media (max-height: 30rem) {
      /* The artwork is sized from the height here, so --w only needs a
         ceiling: a wide window gets the type of a phone held sideways. */
      :root {
        --w: min(1vw, 8.5px);
      }

      main {
        padding-top: 1.5rem;
        padding-bottom: 1.75rem;
      }

      .mark {
        --mark: calc(4rem + 42 * var(--vh));
        margin-bottom: 1.125rem;
      }

      :where(:root:has(.contact, .back)) .mark {
        --mark: calc(2rem + 34 * var(--vh));
        margin-bottom: .875rem;
      }

      h1 {
        font-size: min(clamp(1.75rem, .75rem + 3.6 * var(--w), 2.75rem), 13.5vw);
      }

      .lede::before {
        margin: 1rem auto .875rem;
      }

      .contact,
      .back {
        margin-top: .75rem;
      }
    }

    /* ...and tighter still for a phone held sideways, or a short, narrow
       window where the text runs to more lines. */
    @media (max-height: 22rem), (max-height: 25rem) and (max-width: 29rem) {
      :root {
        --inset-y: 1.25rem;
      }

      main {
        padding-top: .75rem;
        padding-bottom: .875rem;
      }

      .mark {
        --mark: 11rem;
        margin-bottom: .625rem;
      }

      :where(:root:has(.contact, .back)) .mark {
        --mark: 9.5rem;
        margin-bottom: .5rem;
      }

      h1 {
        font-size: min(clamp(1.75rem, .75rem + 3.6 * var(--w), 2.25rem), 13.5vw);
      }

      .lede::before {
        margin: .625rem auto .5rem;
      }

      .contact,
      .back {
        margin-top: .375rem;
      }
    }

    /* ---------- Motion (subtle, opt-in) ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .mark .ring {
        animation: swell 9s ease-in-out infinite;
      }

      .mark .ring:nth-child(2) { animation-delay: .55s; }
      .mark .ring:nth-child(3) { animation-delay: 1.1s; }
      .mark .ring:nth-child(4) { animation-delay: 1.65s; }
      .mark .ring:nth-child(5) { animation-delay: 2.2s; }
      .mark .ring:nth-child(6) { animation-delay: 2.75s; }

      @keyframes swell {
        0%, 45%, 100% { opacity: 1; }
        18% { opacity: .6; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="edge edge--top">
    <p class="wordmark">Neuro Retreats</p>
  </header>

  <main>
    <!-- Decorative mark: a fine dendrite standing in still water, a single
         warm drop where it meets the surface, ripples moving outward. -->
    <svg class="mark" viewBox="0 0 520 224" aria-hidden="true">
      <defs>
        <radialGradient id="mark-glow" class="glow">
          <stop offset="0"/>
          <stop offset=".5"/>
          <stop offset="1"/>
        </radialGradient>
        <!-- The ripples thin out towards the left and right edges... -->
        <linearGradient id="fade-sides" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="506" y2="0">
          <stop offset="0" stop-color="#333"/>
          <stop offset=".26" stop-color="#fff"/>
          <stop offset=".74" stop-color="#fff"/>
          <stop offset="1" stop-color="#333"/>
        </linearGradient>
        <!-- ...and soften at the far side, so they are crispest nearest the viewer. -->
        <linearGradient id="fade-depth" gradientUnits="userSpaceOnUse" x1="0" y1="101.4" x2="0" y2="219.4">
          <stop offset="0" stop-opacity=".55"/>
          <stop offset="1" stop-opacity="0"/>
        </linearGradient>
        <mask id="ripple-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="224">
          <rect width="520" height="224" fill="url(#fade-sides)"/>
          <rect width="520" height="224" fill="url(#fade-depth)"/>
        </mask>
      </defs>
      <ellipse cx="260" cy="160.4" rx="256" ry="104" fill="url(#mark-glow)"/>
      <g mask="url(#ripple-fade)">
        <ellipse class="ring" cx="260" cy="160.4" rx="34" ry="8.2"/>
        <ellipse class="ring" cx="260" cy="160.4" rx="66" ry="15.8" stroke-opacity=".92"/>
        <ellipse class="ring" cx="260" cy="160.4" rx="102" ry="24.5" stroke-opacity=".84"/>
        <ellipse class="ring" cx="260" cy="160.4" rx="144" ry="34.6" stroke-opacity=".76"/>
        <ellipse class="ring" cx="260" cy="160.4" rx="192" ry="46.1" stroke-opacity=".68"/>
        <ellipse class="ring" cx="260" cy="160.4" rx="246" ry="59" stroke-opacity=".6"/>
      </g>
      <g class="arbor">
        <path d="M260 157.4C258.8 137.6 261.4 117.1 260.6 95.4C260.5 90.9 260 87 259.6 82.4"/>
        <path d="M259.6 82.4C258.4 68.1 261.1 53.8 261.8 38.2M260.6 95.4C260.3 83.7 275.4 75.9 288.4 65.5M259.6 82.4C258.8 72 245.5 61.6 233.8 49.9"/>
        <path d="M261.8 38.2C261.1 27.8 255.9 17.4 250.7 7M261.8 38.2C263.1 29.1 269.6 21.3 274.8 12.2M288.4 65.5C294.9 60.3 302.7 56.4 309.2 48.6M288.4 65.5C292.3 57.7 296.2 48.6 294.9 38.2M233.8 49.9C227.3 43.4 222.1 35.6 219.5 26.5M233.8 49.9C226.7 46.8 220.2 46.3 213 49.1"/>
      </g>
      <!-- The tip dots are round-capped strokes of next to no length. (Safari
           draws ones of exactly no length at the wrong size on large screens.) -->
      <path class="tips" d="M250.7 7h.01M274.8 12.2h.01M309.2 48.6h.01M294.9 38.2h.01M219.5 26.5h.01M213 49.1h.01"/>
      <circle class="drop" cx="260" cy="160.4" r="3.4"/>
    </svg>

    <h1>Website under construction</h1>

    <p class="lede">
      <span>We’re building something new.</span>
      <span>Please check back soon.</span>
    </p>

    <!-- CONTACT-SLOT: switched off, so nothing here is shown on the page.
         hello@neuroretreats.com is only a placeholder. To show a contact line,
         put the real address in the href and in the link text below, then
         delete the two lines marked "CONTACT-SLOT START" and "CONTACT-SLOT END".
         The line is already styled (see .contact in the CSS above). -->
    <!-- CONTACT-SLOT START
    <p class="contact">
      <a href="mailto:hello@neuroretreats.com">hello@neuroretreats.com</a>
    </p>
    CONTACT-SLOT END -->
  </main>

  <footer class="edge edge--bottom">
    <p class="legal">© 2026 Neuro Retreats</p>
  </footer>
</body>
</html>
