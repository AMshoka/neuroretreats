<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Neuro Retreats — Under construction</title>
  <meta name="description" content="The Neuro Retreats website is under construction. Please check back soon.">
  <link rel="canonical" href="https://neuroretreats.com/">
  <style>
    :root { --bg: #f6f3ee; --fg: #1d2a2c; --muted: #4f5d5f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10181a; --fg: #eef2f1; --muted: #a9b6b6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg); text-align: center;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .brand { font: 600 0.8rem/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.5rem; }
    h1 { font-weight: 400; font-size: clamp(1.8rem, 6vw, 3.2rem); line-height: 1.15; margin: 0 0 1rem; }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Neuro Retreats</p>
    <h1>Website under construction</h1>
    <p>We&rsquo;re building something new. Please check back soon.</p>
  </main>
</body>
</html>
